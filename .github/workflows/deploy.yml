# Siteyi her "main" dalına gönderimde GitHub Pages'e yayınlar.
name: GitHub Pages'e Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Pages ayarlarını hazırla
        uses: actions/configure-pages@v5

      - name: Site dosyalarını paketle
        run: |
          mkdir -p _site
          cp -r index.html katalog.html assets _site/

      - name: Paketi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
